<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">视频创作工作室共用流程示意</title>
  <desc id="desc">原创流程图，展示输入、计划、留额、生成回收、质检和交付的关系；不是产品截图。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#c67a59"/></marker>
  </defs>
  <rect width="1200" height="390" rx="28" fill="#fffaf2"/>
  <text x="60" y="66" fill="#40302a" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="700">从授权范围到可验证交付</text>
  <text x="60" y="101" fill="#80675b" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="18">工作流示意：每一步都保留真实输入与边界，不能用下一步覆盖上一步的缺口。</text>
  <g font-family="Noto Sans SC, Microsoft YaHei, sans-serif" text-anchor="middle">
    <path d="M193 214H255M373 214h62M553 214h62M733 214h62M913 214h62" stroke="#c67a59" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(55 152)">
      <rect width="138" height="124" rx="18" fill="#fde5bf" stroke="#e6b977"/>
      <circle cx="69" cy="38" r="19" fill="#d95d45"/><path d="M61 38h16M69 30v16" stroke="#fff" stroke-width="4"/>
      <text x="69" y="83" fill="#563d33" font-size="20" font-weight="700">输入与授权</text><text x="69" y="107" fill="#80675b" font-size="14">项目范围 · 素材权利</text>
    </g>
    <g transform="translate(235 152)">
      <rect width="138" height="124" rx="18" fill="#fff2d8" stroke="#e6b977"/>
      <path d="M48 30h43v29H48zM55 66h29" fill="none" stroke="#d95d45" stroke-width="5" stroke-linecap="round"/>
      <text x="69" y="83" fill="#563d33" font-size="20" font-weight="700">计划与锁定</text><text x="69" y="107" fill="#80675b" font-size="14">风格 · 故事板</text>
    </g>
    <g transform="translate(415 152)">
      <rect width="138" height="124" rx="18" fill="#f9e4d8" stroke="#e6b977"/>
      <path d="M47 52h45M47 69h31M52 32h35" stroke="#d95d45" stroke-width="5" stroke-linecap="round"/>
      <text x="69" y="83" fill="#563d33" font-size="20" font-weight="700">成本留额</text><text x="69" y="107" fill="#80675b" font-size="14">复用 · 续查 · 重试</text>
    </g>
    <g transform="translate(595 152)">
      <rect width="138" height="124" rx="18" fill="#f7ead7" stroke="#e6b977"/>
      <path d="M47 33l43 20-43 20z" fill="#d95d45"/><rect x="49" y="82" width="40" height="5" rx="2.5" fill="#c67a59"/>
      <text x="69" y="108" fill="#563d33" font-size="20" font-weight="700">回收与合同</text>
    </g>
    <g transform="translate(775 152)">
      <rect width="138" height="124" rx="18" fill="#e9eedc" stroke="#b6c58a"/>
      <path d="M45 50l15 15 33-37" fill="none" stroke="#6d8749" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="69" y="92" fill="#455736" font-size="20" font-weight="700">媒体与质检</text><text x="69" y="114" fill="#71825d" font-size="14">哈希 · 时长 · 视听</text>
    </g>
    <g transform="translate(955 152)">
      <rect width="138" height="124" rx="18" fill="#f5e0d6" stroke="#dfa48d"/>
      <path d="M43 37h53v39H43z" fill="none" stroke="#b95c43" stroke-width="5" rx="4"/><path d="M55 88h29" stroke="#b95c43" stroke-width="5" stroke-linecap="round"/>
      <text x="69" y="108" fill="#6f3b30" font-size="20" font-weight="700">范围内交付</text>
    </g>
  </g>
  <text x="600" y="345" text-anchor="middle" fill="#80675b" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16">示意图，不代表自动生成、自动发布或对外部平台的成功保证。</text>
</svg>
